name: integration-test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  testV2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: true
      
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2

      - name: Add Airflow Helm repository
        run: helm repo add apache-airflow https://airflow.apache.org && helm repo update
      
      - name: Install Airflow
        run: |
          # airflow v3 helm chart
          helm upgrade --install airflow apache-airflow/airflow --version 1.18.0 \
            --set postgresql.image.repository=bitnamilegacy/postgresql \
            --set postgresql.image.tag=16.1.0-debian-11-r15 \
            --set executor=KubernetesExecutor \
            --set workers.replicas=0 \
            --set redis.enabled=false \
            --set triggerer.enabled=false \
            --set dagProcessor.enabled=false \
            --set scheduler.enabled=false \
            --set statsd.enabled=false \
            --set createUserJob.useHelmHooks=false \
            --set createUserJob.applyCustomEnv=false \
            --set migrateDatabaseJob.useHelmHooks=false \
            --set migrateDatabaseJob.applyCustomEnv=false \
            --set webserver.resources.requests.memory=1Gi \
            --set webserver.resources.limits.memory=1Gi \
            --set config.api.auth_backend=airflow.api.auth.backend.basic_auth \
            --set config.fab.auth_backends=airflow.providers.fab.auth_manager.api.auth.backend.basic_auth \
            --timeout 3m \
            --wait

      - name: Set Airflow environment variable
        run: |
          echo "AIRFLOW_BASE_ENDPOINT=http://localhost:8080" >> $GITHUB_ENV
          echo "SKIP_AIRFLOW_DAG_TESTS=true" >> $GITHUB_ENV
          echo "SKIP_AIRFLOW_DAG_LIST_TESTS=true" >> $GITHUB_ENV
          echo "AIRFLOW_API_BASE_PATH=/api/v2" >> $GITHUB_ENV
          # chart 1.18 ships a FAB provider that only accepts basic auth on the
          # auth manager API, so opt into it for roles/users.
          echo "AIRFLOW_API_USERNAME=admin" >> $GITHUB_ENV
          echo "AIRFLOW_API_PASSWORD=admin" >> $GITHUB_ENV
          echo "AIRFLOW_AUTH_MANAGER_BASIC_AUTH=true" >> $GITHUB_ENV


      - name: Obtain Airflow JWT token
        run: |
          set -euo pipefail
          kubectl port-forward svc/airflow-api-server 8080:8080 &
          sleep 5  # wait for port-forward to be established
          # Try to install jq if it's not present
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq not found, installing..."
            sudo apt-get update && sudo apt-get install -y jq
          fi

          resp=$(curl -s -X POST "${AIRFLOW_BASE_ENDPOINT}/auth/token" -H 'Content-Type: application/json' -d '{"username": "admin", "password": "admin"}')
          # extract token - try common fields
          token=$(echo "$resp" | jq -r '.access_token // .token // .access // empty')
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "Failed to obtain token from response: $resp"
            exit 1
          fi
          echo "AIRFLOW_OAUTH2_TOKEN=$token" >> $GITHUB_ENV

      - name: Run integration tests
        run: |
          ACCTEST_PARALLELISM=3 make testacc
  testV3:
    name: testV3 (Terraform ${{ matrix.terraform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Terraform (protocol 6) and the latest. Resource
        # identity and list resource tests skip below 1.12 and 1.14.
        terraform: ["1.0.11", "latest"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: true
      
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2

      - name: Add Airflow Helm repository
        run: helm repo add apache-airflow https://airflow.apache.org && helm repo update
      
      - name: Install Airflow
        run: |
          # airflow v3.2 helm chart (FAB auth manager API accepts the JWT)
          helm upgrade --install airflow apache-airflow/airflow --version 1.22.0 \
            --set postgresql.image.repository=bitnamilegacy/postgresql \
            --set postgresql.image.tag=16.1.0-debian-11-r15 \
            --set executor=KubernetesExecutor \
            --set workers.replicas=0 \
            --set redis.enabled=false \
            --set triggerer.enabled=false \
            --set-string 'env[0].name=AIRFLOW__CORE__LOAD_EXAMPLES' \
            --set-string 'env[0].value=True' \
            --set scheduler.enabled=false \
            --set statsd.enabled=false \
            --set createUserJob.useHelmHooks=false \
            --set createUserJob.applyCustomEnv=false \
            --set migrateDatabaseJob.useHelmHooks=false \
            --set migrateDatabaseJob.applyCustomEnv=false \
            --set webserver.resources.requests.memory=1Gi \
            --set webserver.resources.limits.memory=1Gi \
            --set config.api.auth_backend=airflow.api.auth.backend.basic_auth \
            --timeout 3m \
            --wait

      - name: Set Airflow environment variable
        run: |
          echo "AIRFLOW_BASE_ENDPOINT=http://localhost:8080" >> $GITHUB_ENV
          echo "SKIP_AIRFLOW_DAG_TESTS=true" >> $GITHUB_ENV
          echo "AIRFLOW_API_BASE_PATH=/api/v2" >> $GITHUB_ENV
          # Airflow 3.2 / FAB 3.3+: the auth manager API accepts the same token.


      - name: Obtain Airflow JWT token
        run: |
          set -euo pipefail
          kubectl port-forward svc/airflow-api-server 8080:8080 &
          sleep 5  # wait for port-forward to be established
          # Try to install jq if it's not present
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq not found, installing..."
            sudo apt-get update && sudo apt-get install -y jq
          fi

          resp=$(curl -s -X POST "${AIRFLOW_BASE_ENDPOINT}/auth/token" -H 'Content-Type: application/json' -d '{"username": "admin", "password": "admin"}')
          # extract token - try common fields
          token=$(echo "$resp" | jq -r '.access_token // .token // .access // empty')
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "Failed to obtain token from response: $resp"
            exit 1
          fi
          echo "AIRFLOW_OAUTH2_TOKEN=$token" >> $GITHUB_ENV

      - name: Wait for the example DAGs to be parsed
        run: |
          # The DAG processor parses the example DAGs after start-up; the DAG
          # list test needs the "tutorial" DAG.
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null -H "Authorization: Bearer ${AIRFLOW_OAUTH2_TOKEN}" "${AIRFLOW_BASE_ENDPOINT}/api/v2/dags/tutorial"; then
              echo "tutorial DAG is available"
              exit 0
            fi
            echo "Waiting for DAG parsing... ($i/60)"
            sleep 5
          done
          echo "tutorial DAG did not appear in time"
          exit 1

      - name: Run integration tests
        env:
          TF_ACC_TERRAFORM_VERSION: ${{ matrix.terraform != 'latest' && matrix.terraform || '' }}
        run: |
          ACCTEST_PARALLELISM=3 make testacc
  testV1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: true
      
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2

      - name: Add Airflow Helm repository
        run: helm repo add apache-airflow https://airflow.apache.org && helm repo update
      
      - name: Install Airflow
        run: |
          # airflow v2 helm chart
          helm upgrade --install airflow apache-airflow/airflow --version 1.16.0 \
            --set postgresql.image.repository=bitnamilegacy/postgresql \
            --set postgresql.image.tag=16.1.0-debian-11-r15 \
            --set executor=KubernetesExecutor \
            --set workers.replicas=0 \
            --set redis.enabled=false \
            --set triggerer.enabled=false \
            --set statsd.enabled=false \
            --set createUserJob.useHelmHooks=false \
            --set createUserJob.applyCustomEnv=false \
            --set migrateDatabaseJob.useHelmHooks=false \
            --set migrateDatabaseJob.applyCustomEnv=false \
            --set webserver.resources.requests.memory=2Gi \
            --set webserver.resources.limits.memory=2Gi \
            --set config.api.auth_backend=airflow.api.auth.backend.basic_auth \
            --timeout 5m \
            --wait

      - name: Set Airflow environment variable
        run: |
          echo "AIRFLOW_BASE_ENDPOINT=http://localhost:8080" >> $GITHUB_ENV
          echo "AIRFLOW_API_USERNAME=admin" >> $GITHUB_ENV
          echo "AIRFLOW_API_PASSWORD=admin" >> $GITHUB_ENV
          echo "SKIP_AIRFLOW_DAG_TESTS=true" >> $GITHUB_ENV
          echo "SKIP_AIRFLOW_DAG_LIST_TESTS=true" >> $GITHUB_ENV

      - name: Port forward Airflow webserver
        run: |
          kubectl port-forward svc/airflow-webserver 8080:8080 &
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health | grep -q "200"; then
              echo "Airflow is ready"
              break
            fi
            echo "Waiting for Airflow... ($i/30)"
            sleep 3
          done

      - name: Run integration tests
        run: |
          ACCTEST_PARALLELISM=3 make testacc
